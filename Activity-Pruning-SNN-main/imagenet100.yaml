# Dataset options
dataset: "ImageNet100"
data_path: "DATA_PATH"
input_size: [3, 224, 224]
batch_size: 128
num_workers: 8

# Augmentation options
no_aug: false
re_prob: 0
re_mode: "const"
re_count: 1
re_split: false
scale: [0.08, 1.0]
ratio: [0.75, 1.3333]
hflip: 0.5
vflip: 0.0
color-jitter: 0.4
auto-augment: "rand-m9-mstd0.5-inc1"
num-aug-repeats: 0
num-aug-splits: 0
interpolation: "bicubic"
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
crop-pct: 0.875
crop-pct-eval: null
crop-mode: "random"

# Mixup / Cutmix
mixup_alpha: 0.0
cutmix_alpha: 0.0
cutmix_minmax: null
mixup_prob: 1.0
mixup_switch_prob: 0.5
mixup_mode: "batch"
label_smoothing: 0.1

# DVS augment
dvs_augment: false

# Training options
seed: 42
epochs: 200
T: 4
eta: 1e-4
eta2: 0.01
model: "sew_resnet18"
lr: 0.1
lr_scheduler: cosine
min_lr: 1e-6
warmup_lr: 0.0
warmup_epochs: 0
optimizer: "sgd"
weight_decay: 5e-4
accumulation_steps: 4
activation: "bptt"

# Other options
output_path: "./imagenet100_logs/tmp"
# resume: "logs/bptt_1e-2/checkpoint_max_acc1.pth"
save_latest: false
# test_only: true
amp: false
print_freq: 10
tb_interval: 10
distributed_init_mode: "env://"
zero_init_residual: false
sync_bn: false

# TET options
TET: false
TET_phi: 1.0
TET_lambda: 0.0