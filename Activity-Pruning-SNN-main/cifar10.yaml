# Dataset options
dataset: "CIFAR10"
data_path: "DATA_PATH"
input_size: [3, 32, 32]
batch_size: 128
num_workers: 4

# Augmentation options
no_aug: false
re_prob: 0.0
re_mode: "const"
re_count: 1
re_split: false
scale: null
ratio: null
hflip: 0.5
vflip: 0.0
color-jitter: 0.4
auto-augment: null
num-aug-repeats: 0
num-aug-splits: 0
interpolation: "bilinear"
mean: [0.4914, 0.4822, 0.4465]
std: [0.2023, 0.1994, 0.2010]
crop-pct: 0.875
crop-pct-eval: null
crop-mode: "random"

# Mixup / Cutmix
mixup_alpha: 0.0
cutmix_alpha: 0.0
cutmix_minmax: null
mixup_prob: 1.0
mixup_switch_prob: 0.5
mixup_mode: "batch"
label_smoothing: 0

# DVS augment
dvs_augment: false

# Training options
seed: 42
epochs: 200
T: 8
eta: 1e-3
eta2: 1e-4
model: "ResNet20"
lr: 0.1
lr_scheduler: cosine
min_lr: 1e-6
warmup_lr: 0.0
warmup_epochs: 0
optimizer: "sgd"
weight_decay: 5e-4
accumulation_steps: 1

# Other options
output_path: "./cifar10_logs/tmp"
# resume: "./cifar10_logs/"
save_latest: false
# test_only: true
amp: true
print_freq: 10
tb_interval: 10
distributed_init_mode: "env://"
zero_init_residual: false
sync_bn: false

# TET options
TET: false
TET_phi: 1.0
TET_lambda: 0.0